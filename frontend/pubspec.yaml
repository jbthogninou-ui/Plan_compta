name: compta_frontend
description: Frontend Flutter du logiciel de comptabilité "Compta"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Réseau
  dio: ^5.4.3+1

  # Stockage sécurisé des tokens
  flutter_secure_storage: ^9.2.2

  # Formatage dates / montants
  intl: ^0.19.0

  # Graphiques du dashboard
  fl_chart: ^0.68.0

  # Icônes
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
